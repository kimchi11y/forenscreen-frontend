<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ForenScreen</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <h1>ForenScreen</h1>
  <p class="muted">Register an original before you share it.</p>

  <div id="account" class="status">Checking your account…</div>
  <div class="actions" id="connect-row" hidden>
    <button id="connect" class="primary" type="button">Connect account</button>
  </div>

  <section id="picker" hidden>
    <label id="drop" class="drop" for="file">
      <strong>Drop an image here</strong>
      <span class="muted">or click to choose one</span>
    </label>
    <input id="file" type="file" accept="image/*" hidden>
    <img id="preview" class="preview" alt="The image you chose" hidden>
    <div class="pair" id="compare" hidden>
      <figure><img id="own" alt="Your image"><figcaption>Your image</figcaption></figure>
      <figure><img id="earlier" alt="Registered earlier by another account"><figcaption>Already registered (earlier)</figcaption></figure>
    </div>
    <div id="result" class="status" hidden></div>
    <div class="actions">
      <button id="anyway" type="button" hidden>Register anyway</button>
      <button id="register" class="primary" type="button" disabled>Register</button>
    </div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
